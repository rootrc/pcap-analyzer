name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux (Clang)
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows (MSVC)
            os: windows-latest
            cmake_args: ""
          - name: macOS (AppleClang)
            os: macos-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ matrix.os }}-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1
    steps:
      - uses: actions/checkout@v4

      - name: Cache CMake dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-sanitizers-${{ hashFiles('tests/CMakeLists.txt') }}

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DBUILD_TESTING=ON
          -DPCAP_SANITIZE=address,undefined
          -DRANDOMIZED_ITERATIONS=200

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -j 4

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_packet, fuzz_dns, fuzz_http, fuzz_pcap_header, fuzz_capture, fuzz_address]
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'schedule' && 900 || 60 }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_FUZZERS=ON -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build-fuzz -j --target ${{ matrix.target }} fuzz_seeds

      - name: Restore accumulated corpus
        uses: actions/cache@v4
        with:
          path: corpus-work
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Replay seeds and past crashes
        run: |
          ./build-fuzz/fuzz/fuzz_seeds unpack seeds --target ${{ matrix.target }}
          ./build-fuzz/fuzz/${{ matrix.target }} -runs=0 seeds/${{ matrix.target }} fuzz/regressions/${{ matrix.target }}

      - name: Fuzz
        run: |
          mkdir -p crashes corpus-work
          DICT=""
          [ -f fuzz/dicts/${{ matrix.target }}.dict ] && DICT="-dict=fuzz/dicts/${{ matrix.target }}.dict"
          ./build-fuzz/fuzz/${{ matrix.target }} $DICT \
            -max_total_time=$FUZZ_SECONDS -rss_limit_mb=2048 -timeout=10 -print_final_stats=1 \
            -artifact_prefix=crashes/ \
            corpus-work seeds/${{ matrix.target }} fuzz/regressions/${{ matrix.target }}

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crashes-${{ matrix.target }}
          path: crashes/
